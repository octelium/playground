apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: network-attachment-definitions.k8s.cni.cncf.io
  labels:
    app.kubernetes.io/managed-by: octelium-installer
spec:
  group: k8s.cni.cncf.io
  scope: Namespaced
  names:
    plural: network-attachment-definitions
    singular: network-attachment-definition
    kind: NetworkAttachmentDefinition
    shortNames:
      - nad
      - net-attach-def
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                config:
                  type: string
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${MULTUS_APP}
  namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: octelium-installer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${MULTUS_APP}
  labels:
    app.kubernetes.io/managed-by: octelium-installer
rules:
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes", "nodes/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceclaims/status", "resourceslices"]
    verbs: ["get", "list"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${MULTUS_APP}
  labels:
    app.kubernetes.io/managed-by: octelium-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${MULTUS_APP}
subjects:
  - kind: ServiceAccount
    name: ${MULTUS_APP}
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ${MULTUS_APP}
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ${MULTUS_APP}
    app.kubernetes.io/managed-by: octelium-installer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ${MULTUS_APP}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${MULTUS_APP}
        app.kubernetes.io/managed-by: octelium-installer
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      serviceAccountName: ${MULTUS_APP}
      terminationGracePeriodSeconds: 10
      tolerations:
        - operator: Exists
      containers:
        - name: multus
          image: ${MULTUS_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - /thin_entrypoint
          args:
            - --multus-conf-file=auto
            - --multus-autoconfig-dir=${CNI_CONF_DIR}
            - --cni-conf-dir=${CNI_CONF_DIR}
            - --cni-bin-dir=${CNI_BIN_DIR}
            - --additional-bin-dir=${CNI_BIN_DIR}
            - --multus-cni-conf-dir=${MULTUS_CONF_DIR}
            - --multus-kubeconfig-file-host=${CNI_CONF_DIR}/multus.d/multus.kubeconfig
            - --cleanup-config-on-exit=true
          resources:
            requests:
              cpu: ${MULTUS_CPU_REQUEST}
              memory: ${MULTUS_MEMORY_REQUEST}
          securityContext:
            privileged: true
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: cni-conf
              mountPath: ${CNI_CONF_DIR}
            - name: multus-conf
              mountPath: ${MULTUS_CONF_DIR}
            - name: cni-bin
              mountPath: ${CNI_BIN_DIR}
      volumes:
        - name: cni-conf
          hostPath:
            path: ${CNI_CONF_DIR}
            type: DirectoryOrCreate
        - name: cni-bin
          hostPath:
            path: ${CNI_BIN_DIR}
            type: DirectoryOrCreate
        - name: multus-conf
          hostPath:
            path: ${MULTUS_CONF_DIR}
            type: DirectoryOrCreate
